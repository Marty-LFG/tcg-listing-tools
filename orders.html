<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fulfilment · Binders Keepers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b0f;--bg2:#0d0f15;--panel:#14171f;--ink:#0b0d12;
    --line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.13);
    --text:#e9edf6;--muted:#8b93a6;--faint:#5b6373;
    --gold:#d4b072;--green:#43d6a0;--amber:#f0c04a;--red:#f0666e;--blue:#6ab0ff;--purple:#c79bff;--pink:#e08a9b;
    --accent:#43d6a0;--accent-soft:rgba(67,214,160,.14);
    --shadow:0 12px 34px -14px rgba(0,0,0,.72);
    --serif:'Fraunces',Georgia,serif;--sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  body{margin:0;min-height:100vh;color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;padding:30px 22px 80px;
    background:radial-gradient(1200px 620px at 12% -12%,rgba(67,214,160,.06),transparent 60%),radial-gradient(1000px 560px at 112% -6%,rgba(106,176,255,.05),transparent 55%),linear-gradient(180deg,#0b0d12,#08090d 62%);background-attachment:fixed;}
  .wrap{max-width:1140px;width:100%;margin:0 auto;}
  a{color:var(--gold);text-decoration:none;}
  .mast{display:flex;align-items:center;gap:14px;margin-bottom:20px;}
  .monogram{width:46px;height:46px;flex:none;border-radius:13px;border:1px solid var(--line2);background:linear-gradient(160deg,#1e2432,#111420);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:19px;color:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),var(--shadow);}
  h1{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:-.015em;margin:0;line-height:1.05;}
  .mast p{color:var(--muted);font-size:12px;margin:4px 0 0;font-family:var(--mono);}
  .mast .home{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);}
  .banner{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:linear-gradient(180deg,var(--panel),var(--bg2));box-shadow:var(--shadow);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;}
  .banner .chip{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--faint);}
  .dot.ok{background:var(--green);box-shadow:0 0 8px rgba(67,214,160,.55);} .dot.warn{background:var(--amber);} .dot.err{background:var(--red);} .dot.info{background:var(--blue);}
  .banner b{color:var(--text);font-weight:600;}
  /* Two deliberate rows rather than one ragged wrap: what you're LOOKING AT, then what you PRINT.
     The controls sorted themselves into those two groups anyway — the toolbar just never said so. */
  .toolbar{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
  .trow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .trow+.trow{padding-top:9px;border-top:1px solid var(--line);}
  /* The three print actions are one object, not three: a segmented pill, primary segment filled.
     Eleven peers at identical weight is what made this row unreadable, not the pixel count. */
  .group{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:10px;background:var(--panel);box-shadow:var(--shadow);}
  .group .btn{border:0;border-radius:0;background:transparent;}
  .group .btn:first-child{border-radius:9px 0 0 9px;}
  .group .btn:last-child{border-radius:0 9px 9px 0;}
  .group .btn+.btn{border-left:1px solid var(--line);}
  .group .btn:hover{background:rgba(67,214,160,.09);color:var(--accent);}
  .group .btn.solid:hover{background:var(--accent);color:var(--ink);opacity:.92;}
  .tabs{display:flex;gap:8px;}
  .tab{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;transition:.15s;}
  .tab:hover{border-color:var(--line2);color:var(--text);}
  .tab.active{color:var(--ink);background:var(--accent);border-color:var(--accent);}
  .tab .n{opacity:.7;font-weight:400;}
  .spacer{flex:1;}
  .btn{font-family:var(--mono);font-size:12px;font-weight:600;border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--text);transition:.15s;}
  .btn:hover{border-color:var(--accent);color:var(--accent);}
  .btn.solid{background:var(--accent);color:var(--ink);border-color:var(--accent);}
  .btn.solid:hover{opacity:.9;color:var(--ink);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .stepper{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--muted);}
  .stepper .s{width:26px;height:26px;border:1px solid var(--line2);background:var(--panel);color:var(--text);border-radius:7px;font-size:15px;font-weight:700;cursor:pointer;line-height:1;padding:0;}
  .stepper .s:hover{border-color:var(--accent);color:var(--accent);}
  .stepper .v{min-width:20px;text-align:center;color:var(--text);font-weight:600;}
  .chk{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted);cursor:pointer;user-select:none;}
  .chk input{width:15px;height:15px;accent-color:var(--accent);}
  th.selcol,td.selcol{width:34px;text-align:center;padding-left:14px;padding-right:0;}
  .selcol input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;}
  .card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel),var(--bg2));box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
  .card h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0;padding:14px 16px 0;font-weight:600;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,.018);}
  .mono{font-family:var(--mono);}
  .muted{color:var(--muted);} .faint{color:var(--faint);} .num{font-family:var(--mono);text-align:right;white-space:nowrap;}
  .pill{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;}
  .pill.shipped{color:var(--green);border-color:rgba(67,214,160,.35);} .pill.unshipped{color:var(--amber);border-color:rgba(240,192,74,.35);}
  .pill.printed{color:var(--blue);border-color:rgba(106,176,255,.4);} .pill.queued{color:var(--muted);}
  .pill.picked{color:var(--purple);border-color:rgba(199,155,255,.4);}
  /* eBay flips an order to "sent" the moment a postage label is bought, which is usually well before
     the cards leave the shelf. Showing that as SHIPPED would quietly drop it out of the day's work. */
  .pill.label_bought{color:var(--amber);border-color:rgba(240,192,74,.45);background:rgba(240,192,74,.1);}
  .pill.combo{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);margin-left:6px;}
  .loc{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--accent);background:var(--accent-soft);border-radius:5px;padding:1px 6px;margin-left:4px;}
  .loc.none{color:var(--faint);background:rgba(255,255,255,.03);}
  /* --- postage --- the same four tiers as the printed docs (lib/postage.mjs is the source of truth).
     Colour carries it here and border weight carries it there: a screen can be trusted to render a
     tint, a print job with "Background graphics" off cannot. Standard is deliberately near-silent —
     nine in ten card orders are plain letters, and a badge on every row destroys the scan. */
  .pg{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;}
  .pg.express{color:var(--red);border-color:rgba(240,102,110,.42);background:rgba(240,102,110,.12);}
  .pg.tracked{color:var(--blue);border-color:rgba(106,176,255,.42);background:rgba(106,176,255,.11);}
  .pg.paid{color:var(--amber);border-color:rgba(240,192,74,.4);background:rgba(240,192,74,.1);}
  .pg.standard{color:var(--faint);border-color:transparent;background:none;padding:0;text-transform:none;letter-spacing:0;font-weight:400;}
  .psvc{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px;}
  .psvc b{color:var(--muted);font-weight:600;}
  /* The rail: a tier-tinted left edge on the row, so a column of colour reads straight down the table
     without a single chip needing to be looked at. */
  tbody td:first-child{border-left:3px solid transparent;}
  tr.tier-express td:first-child{border-left-color:var(--red);}
  tr.tier-tracked td:first-child{border-left-color:var(--blue);}
  tr.tier-paid td:first-child{border-left-color:var(--amber);}
  /* Dispatch deadline. eBay's HandleByTime is a committed date and missing it damages the late-
     dispatch metric, so time remaining is drawn as a draining rule, not just written down. */
  .due{margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;}
  .due .t{font-weight:600;color:var(--green);}
  .due.soon .t{color:var(--amber);} .due.late .t{color:var(--red);}
  .duebar{margin-top:3px;height:2px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden;}
  .duebar i{display:block;height:100%;border-radius:2px;background:var(--green);transition:width .3s;}
  .due.soon .duebar i{background:var(--amber);} .due.late .duebar i{background:var(--red);}
  .trk{display:inline-block;font-family:var(--mono);font-size:10.5px;color:var(--blue);background:rgba(106,176,255,.1);border:1px solid rgba(106,176,255,.3);border-radius:6px;padding:2px 7px;margin-top:5px;cursor:pointer;}
  .trk:hover{border-color:var(--blue);}
  .trk .ext{color:var(--blue);text-decoration:none;margin-left:5px;opacity:.75;}
  .trk .ext:hover{opacity:1;}
  .runbar{display:flex;flex-wrap:wrap;gap:7px 18px;align-items:center;margin:0 0 12px;padding:11px 15px;border:1px solid var(--line);border-radius:12px;
    background:linear-gradient(180deg,rgba(255,255,255,.022),transparent);font-family:var(--mono);font-size:12px;color:var(--muted);}
  .runbar b{color:var(--text);font-weight:600;}
  .runbar .up{color:var(--amber);} .runbar .exp{color:var(--red);}
  .runbar .sep{width:1px;height:13px;background:var(--line2);}
  .items{color:var(--text);} .items .sku{color:var(--faint);font-family:var(--mono);font-size:11px;}
  .items .item{display:flex;gap:9px;align-items:flex-start;padding:3px 0;}
  .cardthumb{width:38px;height:53px;flex:0 0 auto;border-radius:4px;object-fit:cover;background:#0d0f15;border:1px solid var(--line2);}
  .cardthumb.none{display:inline-block;background:repeating-linear-gradient(135deg,#12151d,#12151d 4px,#0d0f15 4px,#0d0f15 8px);}
  .itxt{flex:1;min-width:0;}
  .rowbtns{display:flex;flex-direction:column;gap:5px;align-items:stretch;min-width:120px;}
  button.act{font-family:var(--mono);font-size:11px;color:var(--muted);background:transparent;border:1px solid var(--line2);border-radius:7px;padding:5px 9px;cursor:pointer;transition:.15s;white-space:nowrap;}
  button.act:hover{border-color:var(--accent);color:var(--text);}
  button.act.ship:hover{border-color:var(--green);color:var(--green);}
  button.act.pick:hover{border-color:var(--purple);color:var(--purple);}
  tr.ispicked td{background:rgba(199,155,255,.045);}
  tr.ispicked .items,tr.ispicked .cardthumb{opacity:.62;}
  button.act.combo{color:var(--accent);border-color:rgba(67,214,160,.4);background:var(--accent-soft);}
  button.act.combo:hover{border-color:var(--accent);color:var(--text);}
  /* An upgraded order needs an eBay-bought Australia Post label, so the eBay link becomes the primary
     action and our thermal label demotes. Not disabled — a counter lodgement is still a thing. */
  a.act{display:block;text-align:center;text-decoration:none;font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:7px;padding:5px 9px;white-space:nowrap;transition:.15s;}
  .act.ebay{color:var(--red);border-color:rgba(240,102,110,.45);background:rgba(240,102,110,.1);font-weight:600;}
  .act.ebay:hover{border-color:var(--red);color:var(--text);}
  button.act.ghost{opacity:.5;}
  button.act.ghost:hover{opacity:1;}
  .empty{padding:34px 16px;text-align:center;color:var(--faint);font-family:var(--mono);font-size:12.5px;}
  .status{font-family:var(--mono);font-size:12px;min-height:18px;margin:2px 2px 12px;}
  .status.ok{color:var(--green);} .status.warn{color:var(--amber);} .status.err{color:var(--red);} .status.load{color:var(--muted);}
  .overlay{position:fixed;inset:0;background:rgba(4,5,8,.72);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:36px 18px;z-index:50;overflow:auto;}
  .overlay.open{display:flex;}
  .modal{width:100%;max-width:560px;border:1px solid var(--line2);border-radius:16px;background:linear-gradient(180deg,var(--panel),var(--bg2));box-shadow:0 24px 60px -18px rgba(0,0,0,.8);overflow:hidden;}
  .modal .mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px;}
  .modal .mhead .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;background:none;border:0;}
  .modal .mbody{padding:16px 18px;max-height:60vh;overflow:auto;background:#1a1d26;text-align:center;}
  .modal .mbody canvas{background:#fff;max-width:100%;height:auto;border-radius:6px;box-shadow:0 6px 20px -8px rgba(0,0,0,.6);margin:6px 0;}
  .mfoot{display:flex;gap:9px;align-items:center;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);background:rgba(0,0,0,.15);}
  details.diag{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:0 14px;}
  details.diag summary{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:11px 0;letter-spacing:.03em;list-style:none;}
  details.diag summary::-webkit-details-marker{display:none;}
  .diagrow{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:0 0 14px;}
  .diagrow input{background:var(--ink);border:1px solid var(--line2);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:12px;padding:7px 10px;flex:1;min-width:180px;outline:none;}
  .diagrow button{font-family:var(--mono);font-size:12px;background:var(--accent);color:var(--ink);border:0;border-radius:8px;padding:8px 13px;font-weight:600;cursor:pointer;}
  #diagOut{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto;padding:0 0 12px;}
  #svcOut{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:0 0 14px;}
  #svcOut .h{color:var(--faint);letter-spacing:.06em;text-transform:uppercase;font-size:10px;margin-bottom:7px;}
  #svcOut .r{display:flex;align-items:center;gap:9px;padding:3px 0;}
  #svcOut .c{color:var(--text);min-width:190px;}
  #svcOut .n{color:var(--faint);}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="monogram">BK</div>
    <div>
      <h1>Fulfilment</h1>
      <p>eBay orders · postage · packing slips · address labels · pick sheet</p>
    </div>
    <a class="home" href="/">← all tools</a>
  </div>

  <div class="banner" id="banner"><span class="chip">loading…</span></div>

  <div class="toolbar">
    <div class="trow">
      <div class="tabs" id="tabs">
        <div class="tab active" data-tab="unshipped">To pack <span class="n" id="n_unshipped"></span></div>
        <div class="tab" data-tab="upgrades" title="Orders where the buyer paid for something better than a plain letter">Upgrades <span class="n" id="n_upgrades"></span></div>
        <div class="tab" data-tab="all">All <span class="n" id="n_all"></span></div>
      </div>
      <div class="spacer"></div>
      <span class="chk" title="Orders already pulled off the shelf and packed — they still need posting, they're just off the pull list"><input type="checkbox" id="hidePickedChk"> <span id="hidePickedLbl">Hide picked</span></span>
    </div>

    <div class="trow">
      <span class="chk" title="Show a preview before sending to the printer"><input type="checkbox" id="previewChk"> Preview first</span>
      <span class="stepper" title="Darkness (TSPL DENSITY)">Dark <button class="s" id="densDn">&minus;</button><span class="v" id="densV">–</span><button class="s" id="densUp">+</button></span>
      <span class="stepper" title="Print speed (TSPL SPEED)">Spd <button class="s" id="spdDn">&minus;</button><span class="v" id="spdV">–</span><button class="s" id="spdUp">+</button></span>
      <div class="spacer"></div>
      <div class="group">
        <button class="btn solid" id="pickBtn">🖨 Pick sheet</button>
        <button class="btn" id="slipsBtn" title="Every ticked order's packing slip in one document, one slip per page. A buyer with several orders to the same address gets a single combined slip.">🧾 Slips</button>
        <button class="btn" id="labelsBtn" title="Every ticked order's address label in one run to the AUSPRINT, one label per parcel. Tracked and Express orders are skipped — those travel on an eBay-bought Australia Post label.">📮 Labels</button>
      </div>
      <button class="btn" id="pickedBtn" title="Mark the ticked orders as pulled + packed — they drop off the pull list but stay here to dispatch">✓ Mark picked</button>
      <button class="btn" id="refreshBtn" title="Reload orders">↻</button>
    </div>
  </div>

  <div class="status load" id="status">&nbsp;</div>
  <div class="card" id="panel"><div class="empty">loading…</div></div>

  <details class="diag">
    <summary>⚙ Diagnostics — pull orders from eBay (needs DIAG_TOKEN)</summary>
    <div class="diagrow">
      <input id="diagToken" type="password" placeholder="DIAG_TOKEN (stored in this browser only)" autocomplete="off">
      <button id="btnPoll">Run order poll</button>
      <button id="btnBackfill" title="Pull your recent eBay orders in (eBay's Trading API serves the last ~90 days). Data only — past buyers are never auto-messaged.">Backfill recent (90d)</button>
    </div>
    <div id="diagOut"></div>
    <div id="svcOut"></div>
  </details>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="mhead"><span id="pv_title">Preview</span><button class="x" id="pv_close" title="Close">&times;</button></div>
    <div class="mbody" id="pv_body"></div>
    <div class="mfoot">
      <button class="btn" id="pv_cancel">Cancel</button>
      <button class="btn" id="pv_download">Download PNG</button>
      <button class="btn solid" id="pv_print">🖨 Print</button>
    </div>
  </div>
</div>

<script src="/vendor/qrcode.js"></script>
<script src="/datetime.js"></script>
<script src="/label-render.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const money = (cents, cur='AUD') => (cur==='AUD'?'A$':cur+' ') + ((Math.round(+cents||0))/100).toFixed(2);
const when = (t) => t ? TZ.dateTime(t) : '—';   // Sydney (AEST/AEDT), via datetime.js
function setStatus(cls, msg){ const el=$('status'); el.className='status '+cls; el.textContent=msg||' '; }
async function api(path, opts) {
  const r = await fetch('/api/postsale'+path, opts);
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw Object.assign(new Error(j.error||('HTTP '+r.status)), { status:r.status, body:j });
  return j;
}

// excluded = rows the user unticked by hand; included = picked rows they deliberately ticked BACK on
// (picked orders start unticked, so a plain "not excluded" test isn't enough to remember that choice).
let STATE = { config:null, orders:[], counts:{}, tab:'unshipped', density:null, speed:null, excluded:new Set(), included:new Set(), hidePicked:false };

/* ---------- banner ---------- */
function renderBanner() {
  const c = STATE.config; if (!c) return;
  const cfg = c.config || {}, ebay = c.ebay_oauth || {};
  const chips = [];
  chips.push(`<span class="chip"><span class="dot ${cfg.enabled?'ok':'warn'}"></span>${cfg.enabled?'<b>Order sync on</b>':'Order sync off'}</span>`);
  chips.push(`<span class="chip"><span class="dot ${ebay.connected?'ok':'err'}"></span>eBay ${ebay.connected?'connected':'<a href="/api/repricer/oauth">connect →</a>'}</span>`);
  const pc = STATE.printCfg||{};
  chips.push(`<span class="chip"><span class="dot ${pc.enabled?'ok':'warn'}"></span>Printer ${pc.enabled?('AUSPRINT '+(pc.ip||'')):'off (download only)'}</span>`);
  if (cfg.dry_run) chips.push(`<span class="chip"><span class="dot warn"></span><b>DRY-RUN</b> — Mark shipped won't write to eBay</span>`);
  $('banner').innerHTML = chips.join('');
}

/* ---------- postage ----------
   lib/postage.mjs classifies every order server-side and hands it down as o.postage; this side only
   renders it. The rule shared with the printed docs: only exceptions get ink. */
const TIER_WORD = { express:'Express', tracked:'Tracked', paid:'Paid postage', standard:'standard' };

// eBay's HandleByTime — purchase time plus the listing's handling time — is the date it has committed
// to the buyer on our behalf. The bar drains over the last 36 hours, so "how long have I got" is a
// length before it is a number.
function dueInfo(o) {
  const iso = o.postage && o.postage.handle_by; if (!iso) return null;
  const ms = new Date(iso).getTime(); if (!isFinite(ms)) return null;
  const left = ms - Date.now();
  const cls = left < 0 ? 'late' : left < 6*3600e3 ? 'soon' : 'ok';
  return { iso, left, cls, pct: Math.max(0, Math.min(100, (left / (36*3600e3)) * 100)) };
}
function relTime(ms) {
  const a = Math.abs(ms);
  const d = Math.floor(a/86400e3), h = Math.floor(a/3600e3)%24, m = Math.floor(a/60000)%60;
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
const duePhrase = (left) => (left < 0 ? 'overdue by ' : 'dispatch in ');
function postageCell(o) {
  const p = o.postage;
  if (!p) return '<span class="faint">—</span>';
  const word = TIER_WORD[p.tier] || p.tier;
  const paid = p.paid_cents ? money(p.paid_cents, o.currency) : (p.tier==='standard' ? 'free' : '');
  // When eBay gives us no real service name the label falls back to the tier phrase, which is already
  // what the chip says. Printing "PAID POSTAGE · Paid postage · A$22.00" helps nobody.
  const named = p.label && p.label.toLowerCase() !== String(word).toLowerCase() ? p.label : '';
  const svc = [named, paid].filter(Boolean).join(' · ');
  // Click-to-copy: the number gets typed into Seller Hub or a carrier site often enough to matter.
  const trk = p.tracking ? `<div class="trk" data-copy="${esc(p.tracking)}" title="Copy tracking number">${esc(p.tracking)}`
    + (p.tracking_url ? `<a class="ext" href="${esc(p.tracking_url)}" target="_blank" rel="noopener" title="Track on Australia Post">↗</a>` : '')
    + `</div>` : '';
  const d = o.in_queue ? dueInfo(o) : null;
  const due = d ? `<div class="due ${d.cls}" title="eBay's dispatch deadline · ${esc(when(d.iso))}">${duePhrase(d.left)}<span class="t">${esc(relTime(d.left))}</span>`
    + `<div class="duebar"><i style="width:${d.pct.toFixed(0)}%"></i></div></div>` : '';
  return `<span class="pg ${esc(p.tier)}">${esc(word)}</span>`
    + (svc ? `<span class="psvc">${esc(svc)}</span>` : '')
    + trk + due;
}
// One line above the table: what this run of orders actually needs. The next deadline is here rather
// than buried in a row because it is the only number that decides what you do first.
function runSummary(rows) {
  const ups = rows.filter(o => o.postage && o.postage.upgrade);
  const exp = ups.filter(o => o.postage.tier === 'express').length;
  const dues = rows.filter(o => o.in_queue).map(dueInfo).filter(Boolean).sort((a,b)=>a.left-b.left);
  const bits = [`<span><b>${rows.length}</b> order${rows.length===1?'':'s'}</span>`];
  if (ups.length) {
    bits.push('<span class="sep"></span>');
    bits.push(`<span class="up"><b class="up">${ups.length}</b> need${ups.length===1?'s':''} a postage upgrade</span>`);
    if (exp) bits.push(`<span class="exp">${exp} express</span>`);
  } else if (rows.length) {
    bits.push('<span class="sep"></span><span>all standard postage</span>');
  }
  if (dues.length) {
    bits.push('<span class="sep"></span>');
    const d = dues[0];
    bits.push(`<span>next dispatch deadline <b class="${d.cls==='ok'?'':d.cls==='late'?'exp':'up'}">${d.left<0?'overdue by ':'in '}${esc(relTime(d.left))}</b></span>`);
  }
  return `<div class="runbar">${bits.join('')}</div>`;
}

/* ---------- orders table ---------- */
function itemsCell(items) {
  if (!items || !items.length) return '<span class="faint">—</span>';
  return '<div class="items">' + items.map(it => {
    const loc = it.location ? `<span class="loc">${esc(it.location)}</span>` : `<span class="loc none">loc?</span>`;
    const img = it.image_url
      ? `<img class="cardthumb" src="${esc(it.image_url)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
      : `<span class="cardthumb none" title="image loading…"></span>`;
    return `<div class="item">${img}<div class="itxt">${esc(it.title||it.ebay_item_id||'item')}${it.quantity>1?` ×${it.quantity}`:''}${loc}${it.sku?`<br><span class="sku">${esc(it.sku)}</span>`:''}</div></div>`;
  }).join('') + '</div>';
}
// Group orders that ship together: same buyer AND same ship-to. A group of >1 can print one COMBINED
// packing slip. STATE.groupOf maps an order_id → its sibling orders. Key off the CLEANED address lines
// (name + real street + locality) — eBay masks ship_street1 with a per-order "ebay:<token>" and puts
// the real street in ship_street2, so the raw street1 never matches across a buyer's orders. Using the
// same cleaner the slip prints with (LR.cleanAddressLines) makes the key stable and correct.
function shipGroupKey(o){
  const addr = (window.LR && LR.cleanAddressLines) ? LR.cleanAddressLines(o).join('|')
    : [o.ship_name,o.ship_city,o.ship_state,o.ship_postal].filter(Boolean).join('|');
  return (o.buyer_username||'').toLowerCase()+'|'+String(addr).toLowerCase();
}
function computeGroups(rows){
  const byKey = new Map();
  rows.forEach(o=>{ const k=shipGroupKey(o); if(!byKey.has(k)) byKey.set(k,[]); byKey.get(k).push(o); });
  STATE.groupOf = new Map();
  byKey.forEach(g=>{ if(g.length>1) g.forEach(o=> STATE.groupOf.set(o.order_id, g)); });
}
function renderOrders() {
  computeGroups(STATE.orders);   // group across every loaded order, even ones hidden by "Hide picked"
  const rows = visibleOrders();
  if (!rows.length) {
    if (STATE.tab==='upgrades') return `<div class="empty">No postage upgrades in the queue.<br><span class="faint">Every order waiting is going as standard postage, so the usual letter workflow covers all of them.</span></div>`;
    if (STATE.orders.length) return `<div class="empty">Everything here is picked and packed. ✅<br><span class="faint">Untick “Hide picked” to see the ${STATE.orders.length} order${STATE.orders.length===1?'':'s'} waiting to be posted.</span></div>`;
    return `<div class="empty">${STATE.tab==='unshipped'?'Nothing to pack — all caught up. 🎉':'No orders ingested yet.'}<br><span class="faint">New paid orders appear here after the order poll runs (Diagnostics below, or every ${(STATE.config&&STATE.config.config&&STATE.config.config.poll_interval_min)||10} min).</span></div>`;
  }
  return runSummary(rows)
    + `<table><thead><tr><th class="selcol"><input type="checkbox" id="selAll" checked title="Include all in the pick sheet"></th><th>Order</th><th>Buyer</th><th>Items</th><th>Total</th><th>Ship to</th><th>Postage</th><th>Paid (Sydney)</th><th>Status</th><th>Print / dispatch</th></tr></thead><tbody>`
    + rows.map(o => {
      const loc = [o.ship_city, o.ship_state].filter(Boolean).join(', ') + (o.ship_postal?` ${o.ship_postal}`:'');
      // The pill reports OUR state, not eBay's flag. eBay says "sent" the instant a postage label is
      // bought, which is usually while the cards are still in the box — calling that SHIPPED would
      // drop a job out of the day's work with nothing done. See fulfilment_state in lib/postsale.mjs.
      const fs = o.fulfilment_state || (o.shipped_status==='shipped' ? 'posted' : 'to_pack');
      const pillWord = fs==='label_bought' ? 'label bought' : fs==='posted' ? 'shipped' : 'unshipped';
      const pillCls = fs==='label_bought' ? 'label_bought' : fs==='posted' ? 'shipped' : 'unshipped';
      const statusPill = `<span class="pill ${pillCls}"${fs==='label_bought'?' title="eBay marked this sent when the postage label was bought. The cards still need pulling and the parcel still needs lodging."':''}>${esc(pillWord)}</span>`
        + (fs==='label_bought'?' <span class="pill queued">still to pack</span>':'')
        + (o.dispatch_source==='ebay'&&fs==='posted'?` <span class="pill printed" title="eBay marked this dispatched when the postage label was bought — pulled back on the order poll">via eBay</span>`:'')
        + (o.picked_at?` <span class="pill picked" title="Pulled + packed ${esc(when(o.picked_at))}">picked ✓</span>`:'')
        + (o.label_status==='printed'?' <span class="pill printed">label ✓</span>':'');
      // eBay already has this one dispatched, so there is nothing to tell it — the only thing left is
      // recording that the parcel actually went, which is what clears it from the queue.
      const shipBtn = fs==='label_bought'
        ? `<button class="act ship" data-ship="${esc(o.order_id)}" title="eBay already has this dispatched. This just records that the parcel has gone, and clears it from the queue.">✓ Packed &amp; posted</button>`
        : (o.in_queue ? `<button class="act ship" data-ship="${esc(o.order_id)}">✓ Mark shipped</button>` : '');
      // Picked = pulled off the shelf and packed, still waiting to be posted. Local only — no eBay write.
      const pickBtn = o.picked_at
        ? `<button class="act pick" data-unpick="${esc(o.order_id)}" title="Put this back on the pull list">↺ Unpick</button>`
        : (o.in_queue ? `<button class="act pick" data-pick="${esc(o.order_id)}" title="Pulled + packed — drop it off the pull list, keep it here to dispatch">✓ Picked</button>` : '');
      const grp = STATE.groupOf && STATE.groupOf.get(o.order_id);
      const buyerBadge = grp ? ` <span class="pill combo" title="This buyer has ${grp.length} orders to the same address">×${grp.length}</span>` : '';
      const comboBtn = grp ? `<button class="act combo" data-combined="${esc(o.order_id)}" title="One packing slip for all ${grp.length} of this buyer's orders">🧾 Combined slip (${grp.length})</button>` : '';
      // An upgraded order needs an Australia Post label bought through eBay — there is no API for
      // that (Sell Logistics is USPS-only and US-only), so the honest primary action is a link into
      // Seller Hub. Our thermal label demotes rather than disappears: it is still the right answer
      // for a counter lodgement, just the wrong default.
      const p = o.postage || {};
      const isUp = !!p.upgrade && o.in_queue && fs !== 'label_bought';
      const ebayBtn = (isUp && p.seller_hub_url)
        ? `<a class="act ebay" href="${esc(p.seller_hub_url)}" target="_blank" rel="noopener" title="${esc((p.label||'This order')+' needs an eBay-bought Australia Post label. Opens the order in Seller Hub.')}">📦 Buy label on eBay ↗</a>` : '';
      const labelBtn = `<button class="act${isUp?' ghost':''}" data-label="${esc(o.order_id)}" title="${esc(isUp
        ? 'This order is going '+(p.label||'an upgraded service')+', so the parcel normally carries an eBay label. Only use the thermal label if you are lodging it over the counter yourself.'
        : 'Thermal address label for the AUSPRINT')}">📮 Address label</button>`;
      return `<tr class="${o.picked_at?'ispicked':''} tier-${esc(p.tier||'standard')}">
        <td class="selcol"><input type="checkbox" class="selbox" data-order="${esc(o.order_id)}" ${isSelected(o)?'checked':''} title="Include this order in the pick sheet"></td>
        <td class="mono muted">${esc(o.order_id)}${o.sales_record_number?`<br><span class="faint">rec #${esc(o.sales_record_number)}</span>`:''}</td>
        <td class="mono">@${esc(o.buyer_username||'—')}${buyerBadge}</td>
        <td>${itemsCell(o.items)}</td>
        <td class="num">${money(o.total_cents, o.currency)}</td>
        <td class="muted">${esc(loc||'—')}</td>
        <td>${postageCell(o)}</td>
        <td class="mono muted">${esc(when(o.paid_time))}</td>
        <td>${statusPill}</td>
        <td><div class="rowbtns">
          <button class="act" data-slip="${esc(o.order_id)}">🧾 Packing slip</button>
          ${comboBtn}
          ${ebayBtn}
          ${labelBtn}
          ${pickBtn}
          ${shipBtn}
        </div></td>
      </tr>`;
    }).join('')
    + `</tbody></table>`;
}
function renderPanel() {
  const picked = STATE.orders.filter(o=>o.picked_at).length;
  const heading = STATE.tab==='unshipped' ? 'To pack' : STATE.tab==='upgrades' ? 'Paid a postage upgrade' : 'All orders';
  $('panel').innerHTML = `<h2>${heading}${picked?` · ${picked} picked`:''}</h2>` + renderOrders();
  $('n_unshipped').textContent = STATE.counts.unshipped!=null ? `(${STATE.counts.unshipped})` : '';
  $('n_upgrades').textContent = STATE.counts.upgrades!=null ? `(${STATE.counts.upgrades})` : '';
  $('n_all').textContent = STATE.counts.all!=null ? `(${STATE.counts.all})` : '';
  $('hidePickedLbl').textContent = picked ? `Hide picked (${picked})` : 'Hide picked';
  updateSelAll(); updatePickBtn();
}

async function loadAll() {
  try {
    // Upgrades is a lens on the pack queue, not a separate query — the filter is client-side so the
    // count is honest even when the tab isn't open.
    const statusQ = STATE.tab==='all' ? '?limit=300' : '?limit=300&status=unshipped';
    const [config, orders] = await Promise.all([ api('/config'), api('/orders'+statusQ) ]);
    STATE.config = config;
    STATE.orders = orders.orders || [];
    if (STATE.tab==='all') STATE.counts.all = STATE.orders.length;
    else STATE.counts.unshipped = STATE.orders.length;
    STATE.counts.upgrades = STATE.orders.filter(o => o.postage && o.postage.upgrade && o.in_queue).length;
    renderBanner(); renderPanel(); renderServices();
  } catch (e) {
    $('banner').innerHTML = `<span class="chip"><span class="dot err"></span>${esc(e.message)}</span>`;
  }
}
function orderById(id){ return STATE.orders.find(o => o.order_id === id); }

// Every eBay shipping service this store has actually sold under, and the tier each one currently
// reads as. This is what you look at when a service is being classified wrongly: the codes are
// per-marketplace and per-listing, so there is no list to guess from — only what has really been used.
// Override one under Settings → Post-sale, postage.services.
function renderServices() {
  const el = $('svcOut'); if (!el) return;
  const svc = (STATE.config && STATE.config.observed_services) || [];
  if (!svc.length) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="h">Shipping services seen on real orders</div>' + svc.map(s =>
    `<div class="r"><span class="c">${esc(s.code)}</span><span class="pg ${esc(s.tier)}">${esc(TIER_WORD[s.tier]||s.tier)}</span>`
    + `<span class="n">${esc(s.label||'')} · ${s.orders} order${s.orders===1?'':'s'}`
    // Reads more than one way = the tier is being driven by what the buyer paid rather than by the
    // service code. That's the case worth overriding, so it's the case worth showing.
    + `${s.mixed?` · reads ${esc(s.mixed.join(', '))}`:''}${s.overridden?' · overridden in settings':''}</span></div>`).join('');
}

/* ---------- printing ---------- */
function printOpts(){ return { density: STATE.density, speed: STATE.speed }; }
// The print nudge corrects where the AUSPRINT physically lays ink down, so it has to match
// shipping-label.html or the same address prints in two different spots on the sticker. Mirrors
// that page's seedNudge() precedence exactly: a value calibrated there (localStorage) wins, else
// the .env default from GET /api/print. Note this is the ADDRESS-label calibration — pdf-print.html
// deliberately keeps its own, because a dropped PDF is often full-bleed with no margin to give up.
function labelNudge(){
  const pc = STATE.printCfg || {};
  let sx = null, sy = null;
  try { sx = localStorage.getItem('ship_offx'); sy = localStorage.getItem('ship_offy'); } catch(e){}
  if (sx == null && pc.offXmm != null) sx = pc.offXmm;
  if (sy == null && pc.offYmm != null) sy = pc.offYmm;
  return { offXmm: parseFloat(sx) || 0, offYmm: parseFloat(sy) || 0 };
}
// The AUSPRINT is a raw 9100 socket and takes one job at a time — there is no queue anywhere on the
// print path, so two overlapping POSTs mean two sockets and the printer only accepts one. Every route
// to the printer goes through sendToPrinter, so the guard lives there.
let BATCH_BUSY = false;
// Send jobs to the printer (or download PNG when unconfigured). Optionally record label-printed.
// `orderIds` is one id or many — a batch reaches the printer as ONE job, so it's recorded as one write.
// printJobs (optional) are the nudged rasters that go to the sticker; `jobs` stays unshifted for
// the PNG fallback, which is headed for some other printer where our nudge means nothing.
async function sendToPrinter(jobs, label, orderIds, printJobs, note){
  if (!jobs.length) { setStatus('warn','Nothing to print.'); return; }
  if (BATCH_BUSY) { setStatus('warn','Still printing — the AUSPRINT takes one job at a time.'); return; }
  const ids = orderIds == null ? [] : (Array.isArray(orderIds) ? orderIds : [orderIds]);
  if (STATE.printCfg && STATE.printCfg.enabled){
    setStatus('load','Printing '+label+'…');
    BATCH_BUSY = true; updatePickBtn();
    try {
      const res = await LR.printJobs(printJobs || jobs, printOpts());
      if (res && res.ok){
        setStatus('ok','Printed '+label+' ('+res.printed+' label'+(res.printed>1?'s':'')+').'+(note||''));
        if (ids.length){ try { await api('/orders/label-printed', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ ids }) }); } catch(e){} loadAll(); }
      } else { setStatus('err','Print failed: '+((res&&res.message)||'printer error')); }
    } catch(e){ setStatus('err','Print failed (printer offline?): '+e.message); }
    finally { BATCH_BUSY = false; updatePickBtn(); }
  } else {
    jobs.forEach((j,i)=> LR.downloadJob(j, label.replace(/[^\w]+/g,'-')+(jobs.length>1?('-'+(i+1)):'')+'.png'));
    setStatus('warn','Printer not configured — downloaded '+label+' as PNG'+(jobs.length>1?'s':'')+'.'+(note||''));
  }
}
// Preview modal → confirm-print. When "Preview first" is off, prints straight away.
// The preview shows `jobs` (unshifted): the nudge cancels out a printer that lays ink down off
// its origin, so an unshifted preview is what the finished sticker actually looks like.
function handleJobs(jobs, label, orderIds, printJobs, note){
  if (!jobs.length){ setStatus('warn','Nothing to print.'); return; }
  if (!$('previewChk').checked){ sendToPrinter(jobs, label, orderIds, printJobs, note); return; }
  const body = $('pv_body'); body.innerHTML='';
  jobs.forEach(j => body.appendChild(LR.jobToCanvas(j)));
  $('pv_title').textContent = 'Preview · '+label+(jobs.length>1?(' ('+jobs.length+' pages)'):'');
  $('overlay').classList.add('open');
  $('pv_print').onclick = () => { closePreview(); sendToPrinter(jobs, label, orderIds, printJobs, note); };
  $('pv_download').onclick = () => { jobs.forEach((j,i)=>LR.downloadJob(j, label.replace(/[^\w]+/g,'-')+(jobs.length>1?('-'+(i+1)):'')+'.png')); };
}
function closePreview(){ $('overlay').classList.remove('open'); }

// Packing slip + pick sheet are paper documents → browser print dialog (normal printer / Save as PDF),
// NOT the thermal printer. Only the address label goes to the AUSPRINT.
function printSlip(id){ const o=orderById(id); if(!o) return; LR.openPrintDoc(LR.packingSlipHTML(o), { selfPrint:true }); setStatus('ok','Packing slip → print dialog (opens once the card images load; pick your printer, or Save as PDF).'); }
// Combined slip: all of this buyer's same-address orders on one sheet (items grouped per order).
function printCombinedSlip(id){
  const grp = (STATE.groupOf && STATE.groupOf.get(id)) || [orderById(id)].filter(Boolean);
  if (!grp.length) return;
  const orders = grp.slice().sort((a,b)=> String(a.paid_time||'').localeCompare(String(b.paid_time||'')));
  LR.openPrintDoc(LR.packingSlipHTML(orders), { selfPrint:true });
  setStatus('ok',`Combined packing slip for ${orders.length} orders → print dialog (opens once card images load).`);
}
// Every ticked shipment's slip in ONE document, one slip per page — same paper path as a single slip,
// just stacked. A buyer with two orders still gets one combined sheet, not two.
function printAllSlips(){
  const ships = selectedShipments();
  if (!ships.length){ setStatus('warn','No orders ticked — tick the rows you want packing slips for.'); return; }
  const orderCount = ships.reduce((s,g)=>s+g.length,0);
  const combos = ships.filter(g=>g.length>1).length;
  LR.openPrintDoc(LR.packingSlipBatchHTML(ships), { selfPrint:true });
  setStatus('ok', `${ships.length} packing slip${ships.length===1?'':'s'} for ${orderCount} order${orderCount===1?'':'s'}`
    + (combos ? ` (${combos} combined)` : '')
    + ' → print dialog, one slip per page (opens once the card images load).');
}
// Two rasters when a nudge is set: the plain one for the preview and the PNG fallback, and a
// shifted one for the AUSPRINT. Without this the dashboard printed every address label at offset
// 0 while shipping-label.html printed the same address at the calibrated offset — same printer,
// same stock, two registrations.
function printLabel(id){
  const o = orderById(id); if(!o) return;
  const nud = labelNudge();
  const jobs = [LR.renderAddressLabel(o)];
  const printJobs = (nud.offXmm || nud.offYmm) ? [LR.renderAddressLabel(o, nud)] : jobs;
  handleJobs(jobs, 'address label', id, printJobs);
}
// Every ticked shipment's address label in ONE run: one label per parcel, one POST carrying every
// raster (buildTSPL concatenates them down a single socket). Tracked and Express parcels are skipped
// and NAMED — they travel on an eBay-bought Australia Post label, so a thermal sticker would be a
// second address on the same satchel. Skipping them quietly is how you find out at the post office.
function printAllLabels(){
  const ships = selectedShipments();
  if (!ships.length){ setStatus('warn','No orders ticked — tick the rows you want address labels for.'); return; }
  const skipped = ships.filter(isTrackedShipment);
  const going = ships.filter(g => !isTrackedShipment(g));
  const skipNote = skipped.length
    ? ` · ${skipped.length} tracked parcel${skipped.length===1?'':'s'} skipped — buy those labels on eBay.` : '';
  if (!going.length){
    setStatus('warn', 'Nothing to print — every ticked order is going tracked, so its label is bought on eBay.'); return;
  }
  // ~116 KB of base64 per 100×50 label at 300 dpi against the 16 MB cap on /api/print. Ask before
  // building a batch big enough to be a misclick, rather than letting it come back as a 400.
  if (going.length > 60 && !confirm(`Print ${going.length} address labels in one run?`)) return;
  // Printer off means one PNG download per label, and twenty downloads at once is nobody's intention.
  if (!(STATE.printCfg && STATE.printCfg.enabled) && going.length > 5
      && !confirm(`The printer isn't configured, so this downloads ${going.length} PNGs instead. Continue?`)) return;
  const nud = labelNudge();
  const jobs = going.map(g => LR.renderAddressLabel(g[0]));
  const printJobs = (nud.offXmm || nud.offYmm) ? going.map(g => LR.renderAddressLabel(g[0], nud)) : jobs;
  // Every order in a printed parcel gets the label recorded, not just the one the address came from.
  const ids = going.reduce((a,g) => a.concat(g.map(o=>o.order_id)), []);
  handleJobs(jobs, 'address labels', ids, printJobs, skipNote);
}
// Rows on screen: "Hide picked" clears the packed-and-waiting orders out of the way, the Upgrades tab
// narrows to what the buyer paid extra for, and the pack queue is ordered by eBay's dispatch deadline
// rather than by when the money landed — the deadline is what actually decides what you do first.
// Orders with no deadline (eBay doesn't always send HandleByTime) fall to the end, oldest first.
function visibleOrders(){
  let rows = STATE.hidePicked ? STATE.orders.filter(o=>!o.picked_at) : STATE.orders;
  if (STATE.tab === 'upgrades') rows = rows.filter(o => o.postage && o.postage.upgrade);
  if (STATE.tab !== 'all') {
    rows = rows.slice().sort((a,b) => {
      const da = dueInfo(a), db = dueInfo(b);
      if (da && db) return da.left - db.left;
      if (da) return -1;
      if (db) return 1;
      return String(a.paid_time||'').localeCompare(String(b.paid_time||''));
    });
  }
  return rows;
}
// A picked order starts UNTICKED — it's already in the satchel, so it has no business on the next
// pull list — unless the user deliberately ticks it back on.
function isSelected(o){ return STATE.included.has(o.order_id) || (!STATE.excluded.has(o.order_id) && !o.picked_at); }
// Order ids ticked for the pick sheet (all displayed orders minus the ones unticked).
function selectedOrderIds(){ return visibleOrders().filter(isSelected).map(o=>o.order_id); }
// A SHIPMENT is what physically goes in one satchel: same buyer, same cleaned ship-to (shipGroupKey,
// the same key the ×2 badge and the combined slip use). Grouped over the TICKED orders only — if you
// ticked one of a buyer's two, you meant that one parcel, not a combined slip covering an order you
// deliberately left out. Insertion order follows visibleOrders(), so a batch of slips comes off the
// printer in the same dispatch-deadline order as the pick sheet.
function selectedShipments(){
  const byKey = new Map();
  visibleOrders().filter(isSelected).forEach(o => {
    const k = shipGroupKey(o);
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(o);
  });
  return [...byKey.values()].map(g => g.slice().sort((a,b)=> String(a.paid_time||'').localeCompare(String(b.paid_time||''))));
}
// One tracked order settles it for the whole parcel — it is one satchel and it carries one label.
function isTrackedShipment(g){ return g.some(o => o.postage && o.postage.tracked); }
function updatePickBtn(){
  const n=selectedOrderIds().length, total=visibleOrders().length;
  const b=$('pickBtn'); if(b) b.textContent = n && n<total ? `🖨 Pick sheet (${n})` : '🖨 Pick sheet';
  const pb=$('pickedBtn'); if(pb){ pb.textContent = n ? `✓ Mark picked (${n})` : '✓ Mark picked'; pb.disabled = !n; }
  // These two count PARCELS, not orders, and Labels counts only the parcels that actually get a
  // sticker — a button promising 7 and printing 5 reads as a bug rather than as the tracked ones.
  const ships = selectedShipments(), lab = ships.filter(g=>!isTrackedShipment(g)).length;
  const sb=$('slipsBtn'); if(sb){ sb.textContent = ships.length ? `🧾 Slips (${ships.length})` : '🧾 Slips'; sb.disabled = !ships.length; }
  const lb=$('labelsBtn'); if(lb){ lb.textContent = lab ? `📮 Labels (${lab})` : '📮 Labels'; lb.disabled = !lab || BATCH_BUSY; }
}
function updateSelAll(){ const all=$('selAll'); if(!all) return; const boxes=[...document.querySelectorAll('input.selbox')]; const on=boxes.filter(b=>b.checked).length; all.checked=on===boxes.length; all.indeterminate=on>0&&on<boxes.length; }
async function printPickSheet(){
  const ids = selectedOrderIds();
  if (!ids.length){ setStatus('warn','No orders ticked — select at least one for the pick sheet.'); return; }
  setStatus('load','Building pick sheet…');
  try {
    const ps = await api('/picksheet?ids='+encodeURIComponent(ids.join(',')));
    if (!ps.rows || !ps.rows.length){ setStatus('warn','Nothing to pick — the selected orders have no matched line items.'); return; }
    LR.openPrintDoc(LR.pickSheetHTML(ps.groups, { order_count:ps.order_count, item_count:ps.item_count, unit_count:ps.unit_count, upgrades:ps.upgrades }));
    const ups = (ps.upgrades||[]).length;
    setStatus('ok', ps.order_count+' order'+(ps.order_count===1?'':'s')+' · '+ps.item_count+' line'+(ps.item_count===1?'':'s')
      + (ups ? ' · '+ups+' postage upgrade'+(ups===1?'':'s')+' flagged at the top of the sheet' : '')
      + ' → print dialog (sorted by box). Once they\'re pulled and packed, hit “Mark picked”.');
  } catch(e){ setStatus('err','Pick sheet failed: '+e.message); }
}

// Mark pulled + packed (or undo). Local bookkeeping only — nothing is sent to eBay and the order
// stays in the pack queue for dispatch; it just stops appearing on the pull list.
async function markPicked(ids, picked, btn){
  if (!ids.length) return;
  const orig = btn && btn.textContent;
  if (btn){ btn.disabled = true; btn.textContent = '…'; }
  try {
    const r = await api('/orders/picked', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ ids, picked }) });
    // A picked order drops out of the default selection; clear any stale manual tick/untick for it.
    ids.forEach(id => { STATE.included.delete(id); STATE.excluded.delete(id); });
    setStatus('ok', picked
      ? `${r.updated} order${r.updated===1?'':'s'} marked picked — off the pull list, still here to dispatch.`
      : `${r.updated} order${r.updated===1?'':'s'} back on the pull list.`);
    loadAll();
  } catch(e){
    if (btn){ btn.disabled = false; btn.textContent = orig || '✓ Picked'; }
    setStatus('err', 'Could not update the picked state: '+e.message);
  }
}

async function markShipped(id, btn){
  btn.disabled = true; const orig = btn.textContent; btn.textContent = '…';
  try {
    const r = await api('/orders/'+encodeURIComponent(id)+'/shipped', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({}) });
    setStatus('ok', r.dispatched ? ('Marked dispatched on eBay · '+id) : r.dry_run ? ('Marked shipped (dry-run — no eBay write) · '+id) : ('Marked shipped · '+id));
    loadAll();
  } catch (err) {
    btn.disabled = false; btn.textContent = 'retry';
    const eb = err.body && err.body.ebay;
    const detail = eb && (eb.error || (eb.errors||[]).map(e=>e.shortMessage||e.longMessage).filter(Boolean).join('; '));
    setStatus('err', 'Dispatch failed'+(detail?': '+detail:'')+' — order kept in the queue to retry.');
  }
}

/* ---------- events ---------- */
$('tabs').addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (!t) return;
  STATE.tab = t.dataset.tab;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x===t));
  loadAll();
});
function setSelected(id, on){ if(on){ STATE.excluded.delete(id); STATE.included.add(id); } else { STATE.included.delete(id); STATE.excluded.add(id); } }
$('panel').addEventListener('change', (e) => {
  const cb = e.target.closest('input.selbox');
  if (cb){ setSelected(cb.dataset.order, cb.checked); updateSelAll(); updatePickBtn(); return; }
  const all = e.target.closest('#selAll');
  if (all){ document.querySelectorAll('input.selbox').forEach(x=>{ x.checked=all.checked; setSelected(x.dataset.order, all.checked); }); all.indeterminate=false; updatePickBtn(); }
});
$('panel').addEventListener('click', (e) => {
  // The ↗ inside a tracking chip is a real link — let it through rather than copying instead.
  const copy = e.target.closest('[data-copy]');
  if (copy && !e.target.closest('a')) {
    const v = copy.dataset.copy;
    navigator.clipboard?.writeText(v).then(
      () => setStatus('ok', 'Tracking number copied · ' + v),
      () => setStatus('warn', 'Could not copy — the number is ' + v));
    return;
  }
  const combo = e.target.closest('button[data-combined]'); if (combo) return printCombinedSlip(combo.dataset.combined);
  const slip = e.target.closest('button[data-slip]'); if (slip) return printSlip(slip.dataset.slip);
  const label = e.target.closest('button[data-label]'); if (label) return printLabel(label.dataset.label);
  const pick = e.target.closest('button[data-pick]'); if (pick) return markPicked([pick.dataset.pick], true, pick);
  const unpick = e.target.closest('button[data-unpick]'); if (unpick) return markPicked([unpick.dataset.unpick], false, unpick);
  const ship = e.target.closest('button[data-ship]'); if (ship) return markShipped(ship.dataset.ship, ship);
});
$('pickBtn').addEventListener('click', printPickSheet);
$('slipsBtn').addEventListener('click', printAllSlips);
$('labelsBtn').addEventListener('click', printAllLabels);
$('pickedBtn').addEventListener('click', () => markPicked(selectedOrderIds(), true, $('pickedBtn')));
$('hidePickedChk').addEventListener('change', () => { STATE.hidePicked = $('hidePickedChk').checked; try{localStorage.setItem('ff_hide_picked', STATE.hidePicked?'1':'');}catch(e){} renderPanel(); });
$('refreshBtn').addEventListener('click', loadAll);
$('pv_close').addEventListener('click', closePreview);
$('pv_cancel').addEventListener('click', closePreview);
$('overlay').addEventListener('click', (e)=>{ if (e.target===$('overlay')) closePreview(); });
document.addEventListener('keydown', (e)=>{ if (e.key==='Escape') closePreview(); });

// density / speed steppers (persist in this browser; seeded from the printer config)
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function bumpDensity(d){ STATE.density = clamp((STATE.density??10)+d, 0, 15); $('densV').textContent=STATE.density; try{localStorage.setItem('ff_density',STATE.density);}catch(e){} }
function bumpSpeed(d){ STATE.speed = clamp((STATE.speed??2)+d, 1, 6); $('spdV').textContent=STATE.speed; try{localStorage.setItem('ff_speed',STATE.speed);}catch(e){} }
$('densDn').onclick=()=>bumpDensity(-1); $('densUp').onclick=()=>bumpDensity(1);
$('spdDn').onclick=()=>bumpSpeed(-1); $('spdUp').onclick=()=>bumpSpeed(1);

// diagnostics
const tokenKey = 'postsale_diag_token';
$('diagToken').value = localStorage.getItem(tokenKey) || '';
$('diagToken').addEventListener('change', () => localStorage.setItem(tokenKey, $('diagToken').value.trim()));
$('btnPoll').addEventListener('click', async () => {
  const token = $('diagToken').value.trim();
  $('diagOut').textContent = 'polling eBay for orders…';
  try {
    const r = await fetch('/api/postsale/poll/orders'+(token?('?token='+encodeURIComponent(token)):''), { method:'POST' });
    const j = await r.json().catch(()=>({}));
    $('diagOut').textContent = JSON.stringify(j, null, 2);
    if (r.ok) loadAll();
  } catch (e) { $('diagOut').textContent = 'poll failed: '+e.message; }
});
$('btnBackfill').addEventListener('click', async () => {
  const token = $('diagToken').value.trim();
  if (!confirm('Pull your recent eBay orders into the dashboard?\n\neBay\'s Trading API serves the last ~90 days. Data only — past buyers are never auto-messaged.')) return;
  $('btnBackfill').disabled = true;
  $('diagOut').textContent = 'backfilling historical orders… (this can take a minute)';
  try {
    const r = await fetch('/api/postsale/backfill?months=60'+(token?('&token='+encodeURIComponent(token)):''), { method:'POST' });
    const j = await r.json().catch(()=>({}));
    $('diagOut').textContent = JSON.stringify(j, null, 2);
    if (r.ok) loadAll();
  } catch (e) { $('diagOut').textContent = 'backfill failed: '+e.message; }
  finally { $('btnBackfill').disabled = false; }
});

/* ---------- init ---------- */
(async function(){
  STATE.printCfg = await LR.loadPrintCfg();
  try { const d=localStorage.getItem('ff_density'); const s=localStorage.getItem('ff_speed'); STATE.density = d!=null?+d:(STATE.printCfg.density??10); STATE.speed = s!=null?+s:(STATE.printCfg.speed??2); } catch(e){ STATE.density=10; STATE.speed=2; }
  $('densV').textContent = STATE.density; $('spdV').textContent = STATE.speed;
  try { STATE.hidePicked = localStorage.getItem('ff_hide_picked')==='1'; } catch(e){}
  $('hidePickedChk').checked = STATE.hidePicked;
  await loadAll();
  setInterval(loadAll, 60000);
})();
</script>
